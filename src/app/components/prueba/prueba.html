    @if (screenLoading) {
      <div class="loader-overlay">
        <div class="spinner"></div>

<div [class.disabled]="screenLoading" class="pruebas">
    <div class="contenedor-principal">
        <h1>¡'Prueba' OK!</h1>

        <button mat-raised-button color="warn" (click)="Ping()">

        <button mat-raised-button color="primary" (click)="RegresarAInicio()">
            <mat-icon>arrow_backward</mat-icon>Regresar a Inicio
        </button>
    </div>
</div>
